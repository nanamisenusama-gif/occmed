<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>職業醫學服務</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
:root{--bg:#f3f6f8;--ink:#16252e;--muted:#58707e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a20;--ink:#e8f0f4;--muted:#9db3bf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a20;--ink:#e8f0f4;--muted:#9db3bf;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-weight:500;font-size:17px;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:26px;margin:0 0 4px;line-height:1.3}
p.lead{margin:0 0 22px;color:var(--muted)}
.btns{display:grid;gap:14px}
a.b{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;border-radius:14px;padding:22px 18px;font-weight:700;font-size:21px;line-height:1.35}
a.b small{display:block;font-weight:500;font-size:15px;margin-top:2px;opacity:.9}
a.b .go{font-size:24px;flex:none}
.c1{background:#fdb06a;color:#3a2108}.c2{background:#9cc3e6;color:#10283a}.c3{background:#0b4f7a;color:#fff}
a.b:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>職業醫學服務</h1>
<p class="lead">請點選您的身分或需求，會直接前往對應頁面。</p>
<div class="btns">
<a class="b c1" href="https://reurl.cc/90YQyj" target="_blank" rel="noopener"><span>我是廠商<small>想要諮詢臨場服務</small></span><span class="go" aria-hidden="true">›</span></a>
<a class="b c2" href="https://lin.ee/zJgZbzB" target="_blank" rel="noopener"><span>我是傷患<small>想諮詢職災相關事項</small></span><span class="go" aria-hidden="true">›</span></a>
<a class="b c3" href="https://reurl.cc/GgRl0y" target="_blank" rel="noopener"><span>我想掛號<small>職業醫學科門診</small></span><span class="go" aria-hidden="true">›</span></a>
</div>
</main>
</body>
</html>
